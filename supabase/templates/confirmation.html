<!doctype html>
<html lang="ja">
  <body style="font-family: sans-serif; color: #0f172a; line-height: 1.7">
    <h2>メールアドレスを確認してください</h2>
    <p>SiteOpsへのご登録ありがとうございます。</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
        style="
          display: inline-block;
          border-radius: 8px;
          background: #2563eb;
          padding: 10px 16px;
          color: #ffffff;
          text-decoration: none;
        "
      >
        メールアドレスを確認する
      </a>
    </p>
    <p>この操作に心当たりがない場合は、このメールを破棄してください。</p>
  </body>
</html>
